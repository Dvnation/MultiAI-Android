name: Build iOS Application (Simulator)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Simulator App on Cloud macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Verify Android Kotlin Build
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Build iOS Simulator App with Xcode
        run: |
          mkdir -p build/ios
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Inspect & Verify iOS App Bundle Contents
        run: |
          APP_PATH="build/ios/DerivedData/Build/Products/Debug-iphonesimulator/iosApp.app"
          
          echo "======================================================="
          echo " 1. TOTAL DIRECTORY SIZE"
          echo "======================================================="
          du -sh "$APP_PATH"
          du -k "$APP_PATH"
          
          echo ""
          echo "======================================================="
          echo " 2. FILE & FOLDER LISTING INSIDE BUNDLE"
          echo "======================================================="
          ls -laR "$APP_PATH"
          
          echo ""
          echo "======================================================="
          echo " 3. BINARY COMPILATION & ARCHITECTURE VERIFICATION"
          echo "======================================================="
          file "$APP_PATH/iosApp"
          otool -L "$APP_PATH/iosApp"
          
          echo ""
          echo "======================================================="
          echo " 4. INFO.PLIST STRUCTURE"
          echo "======================================================="
          plutil -p "$APP_PATH/Info.plist"

      - name: Stage & Zip Complete iOS .app Bundle
        run: |
          mkdir -p build/ios/export
          cp -R build/ios/DerivedData/Build/Products/Debug-iphonesimulator/iosApp.app build/ios/export/MultiAI.app
          cd build/ios/export
          zip -r MultiAI_iOS_Simulator.zip MultiAI.app

      - name: Upload iOS Simulator App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiAI-iOS-Simulator-App
          path: build/ios/export/MultiAI_iOS_Simulator.zip
          retention-days: 14
