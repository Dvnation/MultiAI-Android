name: Build iOS Application (Simulator)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Simulator App on Cloud macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Verify Android Kotlin Build
        run: ./gradlew :app:compileDebugKotlin --no-daemon --no-configuration-cache
     

      - name: Build iOS Simulator App with Xcode
        run: |
          mkdir -p build/ios
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Automated iOS Simulator Boot & App Launch Test
        run: |
          echo "======================================================="
          echo " 1. FIND AVAILABLE SIMULATOR DEVICE"
          echo "======================================================="
          UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -n 1 | sed -E 's/.* \(([-A-F0-9]+)\).*/\1/')
          
          if [ -z "$UDID" ]; then
            echo "Creating a new iPhone Simulator..."
            UDID=$(xcrun simctl create "iPhone Test" "com.apple.CoreSimulator.SimDeviceType.iPhone-15" "com.apple.CoreSimulator.SimRuntime.iOS-17-5")
          fi
          
          echo "Selected Simulator UDID: $UDID"
          
          echo "======================================================="
          echo " 2. BOOT SIMULATOR DEVICE"
          echo "======================================================="
          xcrun simctl boot "$UDID" || true
          
          echo "======================================================="
          echo " 3. INSTALL APP BUNDLE ON SIMULATOR"
          echo "======================================================="
          APP_PATH="build/ios/DerivedData/Build/Products/Debug-iphonesimulator/iosApp.app"
          xcrun simctl install "$UDID" "$APP_PATH"
          
          echo "======================================================="
          echo " 4. LAUNCH APPLICATION ON SIMULATOR"
          echo "======================================================="
          xcrun simctl launch "$UDID" com.example.myapplication.iosApp
          
          echo "======================================================="
          echo " 5. CAPTURE SIMULATOR SCREENSHOT"
          echo "======================================================="
          mkdir -p build/ios/screenshots
          xcrun simctl io "$UDID" screenshot build/ios/screenshots/simulator_launch.png || true
          
          echo "✅ RUNTIME LAUNCH TEST PASSED: App installed, launched, and rendered on iOS Simulator!"

      - name: Inspect & Verify iOS App Bundle Contents
        run: |
          APP_PATH="build/ios/DerivedData/Build/Products/Debug-iphonesimulator/iosApp.app"
          
          echo "======================================================="
          echo " 1. TOTAL DIRECTORY SIZE"
          echo "======================================================="
          du -sh "$APP_PATH"
          du -k "$APP_PATH"
          
          echo ""
          echo "======================================================="
          echo " 2. FILE & FOLDER LISTING INSIDE BUNDLE"
          echo "======================================================="
          ls -laR "$APP_PATH"
          
          echo ""
          echo "======================================================="
          echo " 3. BINARY COMPILATION & ARCHITECTURE VERIFICATION"
          echo "======================================================="
          file "$APP_PATH/iosApp"
          otool -L "$APP_PATH/iosApp"
          
          echo ""
          echo "======================================================="
          echo " 4. INFO.PLIST STRUCTURE"
          echo "======================================================="
          plutil -p "$APP_PATH/Info.plist"

      - name: Stage & Package Complete iOS .app Bundle
        run: |
          mkdir -p build/ios/export/MultiAI_Bundle
          cp -R build/ios/DerivedData/Build/Products/Debug-iphonesimulator/iosApp.app build/ios/export/MultiAI_Bundle/MultiAI.app
          cp build/ios/screenshots/simulator_launch.png build/ios/export/MultiAI_Bundle/simulator_launch.png || true
          
          echo "======================================================="
          echo " STAGING VERIFICATION"
          echo "======================================================="
          ls -laR build/ios/export/MultiAI_Bundle/MultiAI.app
          
          echo "======================================================="
          echo " PACKAGING MultiAI.app DIRECTORY INTO ZIP"
          echo "======================================================="
          cd build/ios/export/MultiAI_Bundle
          zip -r ../MultiAI_iOS_Simulator.zip MultiAI.app simulator_launch.png
          cd ../../../..

      - name: Inspect & Validate ZIP Entry Hierarchy (Strict Fail Guard)
        run: |
          echo "======================================================="
          echo " UNZIP CONTENTS LISTING (unzip -l)"
          echo "======================================================="
          unzip -l build/ios/export/MultiAI_iOS_Simulator.zip
          
          echo "======================================================="
          echo " VERIFYING DIRECTORY ROOT ENTRY MultiAI.app/"
          echo "======================================================="
          if ! unzip -l build/ios/export/MultiAI_iOS_Simulator.zip | grep -q "MultiAI.app/"; then
            echo "❌ ERROR: ZIP archive does NOT contain top-level MultiAI.app/ directory root!"
            exit 1
          fi
          echo "✅ VERIFICATION SUCCESSFUL: ZIP archive strictly contains MultiAI.app/ directory root!"

      - name: Upload iOS Simulator App ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MultiAI-iOS-Simulator-App
          path: build/ios/export/MultiAI_iOS_Simulator.zip
          retention-days: 14
