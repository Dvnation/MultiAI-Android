
workflows:
  ios-workflow:
    name: MultiSearch AI iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      vars:
        XCODE_WORKSPACE: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
      xcode: latest

    scripts:
      - name: Build iOS application
        script: |
          xcodebuild \
            -project "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - build/Build/Products/Release-iphoneos/*.app
